<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | AI Math Trading Terminal</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050505; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #0f0f0f; padding: 25px; border-radius: 20px; width: 100%; max-width: 480px; margin: 15px auto; border: 1px solid #1a1a1a; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: white; outline: none; font-size: 16px; }
        input:focus { border-color: #bb86fc; }
        .btn { width: 100%; padding: 15px; background: #bb86fc; color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px; }
        .btn:active { transform: scale(0.98); }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #1a1a1a; padding: 5px; border-radius: 15px; }
        .nav-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #888; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: #bb86fc; color: black; }
        .tool-box { background: #141414; padding: 20px; margin: 15px 0; border-radius: 15px; border-left: 4px solid #bb86fc; text-align: left; }
        .strat-btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .strat-btn { flex: 1; padding: 10px; font-size: 12px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; cursor: pointer; }
        .strat-btn.selected { border-color: #bb86fc; color: #bb86fc; background: #1a1125; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #bb86fc; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #aiResult { margin-top: 20px; word-wrap: break-word; }
        .price-text { color: #03dac6; font-weight: bold; font-family: monospace; }
    </style>
</head>
<body>

    <div id="authPage" class="card">
        <h2 id="authTitle" style="color: #bb86fc;">VIPFIBO LOGIN</h2>
        <div class="nav-tabs">
            <button id="tabLogin" class="nav-btn active" onclick="setAuthMode('login')">Kirish</button>
            <button id="tabReg" class="nav-btn" onclick="setAuthMode('reg')">Registratsiya</button>
        </div>
        <input type="text" id="userInsta" placeholder="Instagram (@username)">
        <input type="password" id="userPass" placeholder="Parol">
        <div id="regExtra" class="hidden">
            <input type="text" id="userName" placeholder="Ismingiz">
            <input type="text" id="userPromo" placeholder="Promo-kod (Vip1...Vip1000)">
        </div>
        <button class="btn" onclick="handleAuth()">Davom etish</button>
        <p style="font-size: 10px; color: #333; margin-top: 30px; cursor: pointer;" onclick="openAdmin()">Admin Panel</p>
    </div>

    <div id="mainPage" class="card hidden">
        <h3 id="welcomeHeader" style="margin-bottom: 20px;">Trader</h3>
        <div class="nav-tabs">
            <button id="tabAI" class="nav-btn active" onclick="switchView('ai')">AI Analiz</button>
            <button id="tabFibo" class="nav-btn" onclick="switchView('fibo')">Fibo Setting</button>
        </div>

        <div id="lockedSection" class="tool-box" style="border-color: #f44336; text-align: center;">
            <p>🔒 Hisobingiz faol emas. <br><small>Admin tomonidan ruxsat berilishini kuting.</small></p>
        </div>

        <div id="unlockedSection" class="hidden">
            <div id="aiView">
                <div class="tool-box">
                    <h4 style="color:#4caf50; margin:0;">🤖 AI Multi-Strategy Analysis</h4>
                    <p style="font-size: 11px; color: #888; margin: 10px 0;">Strategiyani tanlang:</p>
                    <div class="strat-btn-group">
                        <button id="btnSNR" class="strat-btn selected" onclick="setStrategy('SNR')">SNR Strategiya</button>
                        <button id="btn26" class="strat-btn" onclick="setStrategy('2.6')">2.6 Matematik</button>
                    </div>
                    <input type="file" id="chartImg" accept="image/*" style="margin-top:20px; font-size: 12px; border:none; background:#1a1a1a;">
                    <button class="btn" onclick="startDeepAnalysis()">Analizni Boshlash</button>
                    <div id="aiResult"></div>
                </div>
            </div>

            <div id="fiboView" class="hidden">
                <div class="tool-box" style="border-color: #03dac6;">
                    <h4 style="color:#03dac6; margin:0;">📐 OTE Professional Settings</h4>
                    <p style="font-size: 13px; margin-top:15px;"><b>Levels:</b> 0, 0.5, 0.618, 0.705, 0.79, 1</p>
                    <p style="font-size: 12px; color: #888;">Razvorat zonasi: 0.705 - 0.79 oralig'i.</p>
                </div>
            </div>
        </div>
        <button class="btn" style="background:#222; color:white; margin-top:20px;" onclick="location.reload()">Chiqish</button>
    </div>

    <div id="adminPage" class="card hidden">
        <h2 style="color: #bb86fc;">Admin Panel</h2>
        <div id="userList" style="text-align: left; max-height: 300px; overflow-y: auto;"></div>
        <button class="btn" onclick="location.reload()">Orqaga</button>
    </div>

<script>
    // --- KONFIGURATSIYA ---
    const MY_GEMINI_API_KEY = "AIzaSyDWmZbEE6uW3nZbqeC7LQVd7pLxvuhBLhI"; // Siz bergan kalit o'rnatildi

    const firebaseConfig = {
        apiKey: "AIzaSyAFGJtXKgL8a1AjYK1w9ft7hI4",
        authDomain: "vipfibo-cf608.firebaseapp.com",
        databaseURL: "https://vipfibo-cf608-default-rtdb.firebaseio.com",
        projectId: "vipfibo-cf608",
        storageBucket: "vipfibo-cf608.firebasestorage.app",
        messagingSenderId: "73178155867",
        appId: "1:73178155867:web:1cfc3757d2d09668102462"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUid = "";
    let authMode = "login";
    let selectedStrategy = "SNR";

    function setAuthMode(m) {
        authMode = m;
        document.getElementById('tabLogin').classList.toggle('active', m === 'login');
        document.getElementById('tabReg').classList.toggle('active', m === 'reg');
        document.getElementById('regExtra').classList.toggle('hidden', m === 'login');
        document.getElementById('authTitle').innerText = m === 'login' ? "VIPFIBO LOGIN" : "VIPFIBO REG";
    }

    function setStrategy(s) {
        selectedStrategy = s;
        document.getElementById('btnSNR').classList.toggle('selected', s === 'SNR');
        document.getElementById('btn26').classList.toggle('selected', s === '2.6');
    }

    function handleAuth() {
        const insta = document.getElementById('userInsta').value.trim();
        const pass = document.getElementById('userPass').value.trim();
        if(!insta || !pass) return alert("Barcha maydonlarni to'ldiring!");
        const uid = btoa(insta).replace(/=/g, "");

        if(authMode === "reg") {
            const name = document.getElementById('userName').value;
            const promo = document.getElementById('userPromo').value;
            db.ref('users/' + uid).set({ name, instagram: insta, password: pass, promo, isPro: false })
              .then(() => { alert("Muvaffaqiyatli! Endi Login qiling."); location.reload(); });
        } else {
            db.ref('users/' + uid).once('value', (s) => {
                const u = s.val();
                if(u && u.password === pass) { 
                    currentUid = uid; 
                    startDashboard(u.name); 
                } else alert("Instagram yoki Parol xato!");
            });
        }
    }

    function startDashboard(name) {
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
        document.getElementById('welcomeHeader').innerText = "Trader: " + name;
        db.ref('users/' + currentUid).on('value', (s) => {
            const u = s.val();
            document.getElementById('lockedSection').classList.toggle('hidden', u.isPro);
            document.getElementById('unlockedSection').classList.toggle('hidden', !u.isPro);
        });
    }

    function switchView(v) {
        document.getElementById('tabAI').classList.toggle('active', v === 'ai');
        document.getElementById('tabFibo').classList.toggle('active', v === 'fibo');
        document.getElementById('aiView').classList.toggle('hidden', v !== 'ai');
        document.getElementById('fiboView').classList.toggle('hidden', v !== 'fibo');
    }

    async function startDeepAnalysis() {
        const fileInput = document.getElementById('chartImg');
        const res = document.getElementById('aiResult');
        if (!fileInput.files[0]) return alert("Avval grafik rasmini yuklang!");

        res.innerHTML = `<div class="loader"></div><p style="text-align:center; font-size:12px; color:#bb86fc;">Haqiqiy AI rasmdagi narxlarni tahlil qilmoqda...</p>`;

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onload = async () => {
            const base64Image = reader.result.split(',')[1];
            
            // AI Prompt
            const promptText = `Sen professional tradersan. Ushbu grafikni ${selectedStrategy} strategiyasi bo'yicha tahlil qil. Rasmdagi narx darajalarini (Price) o'qi. 
            Agar SNR bo'lsa, Support va Resistance darajalarini aniq raqamlarda ko'rsat. 
            Agar 2.6 bo'lsa, narxdan kelib chiqib matematik kirish va maqsad darajalarini hisoblab yoz. Faqat aniq tahlil va raqamlarni yoz.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
                    })
                });

                const data = await response.json();
                if(data.candidates && data.candidates[0]) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    res.innerHTML = `
                        <div style="background:#000; padding:15px; border-radius:12px; border:1px solid #333; font-size:13px; line-height:1.6; text-align:left; color:#e0e0e0;">
                            <b style="color:#bb86fc; display:block; margin-bottom:10px; border-bottom:1px solid #222; padding-bottom:5px;">🤖 AI VISION NATIJASI:</b>
                            <div style="white-space: pre-wrap;">${aiText}</div>
                        </div>`;
                } else {
                    res.innerHTML = "<p style='color:red;'>AI xatolik berdi. Rasm sifatini tekshiring.</p>";
                }
            } catch (e) {
                res.innerHTML = "<p style='color:red;'>API ulanish xatosi! Internetni tekshiring.</p>";
            }
        };
    }

    function openAdmin() {
        if(prompt("Admin paroli?") === "adminfibo007") {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            loadAdmin();
        }
    }

    function loadAdmin() {
        db.ref('users').on('value', (snap) => {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            snap.forEach((child) => {
                const u = child.val();
                list.innerHTML += `
                    <div style="padding:12px; background:#1a1a1a; margin-top:8px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #333;">
                        <div><b style="font-size:14px;">${u.name}</b><br><small style="color:#666;">${u.promo}</small></div>
                        <button style="padding:6px 15px; border-radius:8px; border:none; cursor:pointer; font-weight:bold; background:${u.isPro ? '#f44336':'#4caf50'}; color:white;" 
                            onclick="db.ref('users/${child.key}').update({isPro:${!u.isPro}})">${u.isPro ? 'O\'chirish':'Yoqish'}</button>
                    </div>`;
            });
        });
    }
</script>
</body>
</html>
