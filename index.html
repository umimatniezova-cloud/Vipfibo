<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | AI Math Trading</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #0f0f0f; padding: 25px; border-radius: 20px; width: 100%; max-width: 480px; margin: 15px auto; border: 1px solid #1a1a1a; text-align: center; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: white; outline: none; }
        .btn { width: 100%; padding: 15px; background: #bb86fc; color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #1a1a1a; padding: 5px; border-radius: 15px; }
        .nav-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #888; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: #bb86fc; color: black; }
        .tool-box { background: #141414; padding: 20px; margin: 15px 0; border-radius: 15px; border-left: 4px solid #bb86fc; text-align: left; }
        .strat-btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .strat-btn { flex: 1; padding: 10px; font-size: 12px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; cursor: pointer; }
        .strat-btn.selected { border-color: #bb86fc; color: #bb86fc; background: #1a1125; }
        .price-tag { color: #f44336; font-family: monospace; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <div id="authPage" class="card">
        <div class="nav-tabs">
            <button id="tabLogin" class="nav-btn active" onclick="setAuthMode('login')">Login</button>
            <button id="tabReg" class="nav-btn" onclick="setAuthMode('reg')">Registratsiya</button>
        </div>
        <input type="text" id="userInsta" placeholder="Instagram (@username)">
        <input type="password" id="userPass" placeholder="Parol">
        <div id="regExtra" class="hidden">
            <input type="text" id="userName" placeholder="Ismingiz">
            <input type="text" id="userPromo" placeholder="Promo-kod (Vip1...Vip1000)">
        </div>
        <button class="btn" onclick="handleAuth()">Kirish</button>
        <p style="font-size: 10px; color: #111; margin-top: 20px;" onclick="openAdmin()">Admin Panel</p>
    </div>

    <div id="mainPage" class="card hidden">
        <h3 id="welcomeHeader">Salom!</h3>
        <div class="nav-tabs">
            <button id="tabAI" class="nav-btn active" onclick="switchView('ai')">AI Analiz</button>
            <button id="tabFibo" class="nav-btn" onclick="switchView('fibo')">Fibo Setting</button>
        </div>

        <div id="lockedSection" class="tool-box" style="border-color: #f44336; text-align: center;">
            <p>🔒 Admin ruxsati kutilmoqda...</p>
        </div>

        <div id="unlockedSection" class="hidden">
            <div id="aiView">
                <div class="tool-box">
                    <h4 style="color:#4caf50; margin-top:0;">🤖 AI Multi-Strategy Analysis</h4>
                    <p style="font-size: 12px; color: #888;">Strategiyani tanlang va rasm yuklang:</p>
                    
                    <div class="strat-btn-group">
                        <button id="btnSNR" class="strat-btn selected" onclick="setStrategy('SNR')">SNR Strategiya</button>
                        <button id="btn26" class="strat-btn" onclick="setStrategy('2.6')">2.6 Matematik</button>
                    </div>

                    <input type="file" id="chartImg" accept="image/*" style="margin-top:15px; font-size: 12px;">
                    <button class="btn" onclick="startDeepAnalysis()">Analizni Boshlash</button>
                    <div id="aiResult" style="margin-top: 15px;"></div>
                </div>
            </div>

            <div id="fiboView" class="hidden">
                <div class="tool-box" style="border-color: #03dac6;">
                    <h4>📐 Garant Razvorat & Entry</h4>
                    <p><b>Razvorat:</b> <span style="color:#f44336">0.705 - 0.79</span></p>
                    <p><b>Pragnoz:</b> <span style="color:#4caf50">High Accuracy DL 0.618</span></p>
                </div>
            </div>
        </div>
        <button class="btn" style="background:#222; color:white;" onclick="location.reload()">Chiqish</button>
    </div>

    <div id="adminPage" class="card hidden">
        <h2>Admin</h2><div id="userList"></div>
        <button class="btn" onclick="location.reload()">Orqaga</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAFGJtXKgL8a1AjYK1w9ft7hI4",
        authDomain: "vipfibo-cf608.firebaseapp.com",
        databaseURL: "https://vipfibo-cf608-default-rtdb.firebaseio.com",
        projectId: "vipfibo-cf608",
        storageBucket: "vipfibo-cf608.firebasestorage.app",
        messagingSenderId: "73178155867",
        appId: "1:73178155867:web:1cfc3757d2d09668102462"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUid = "";
    let authMode = "login";
    let selectedStrategy = "SNR";

    function setAuthMode(m) {
        authMode = m;
        document.getElementById('tabLogin').classList.toggle('active', m === 'login');
        document.getElementById('tabReg').classList.toggle('active', m === 'reg');
        document.getElementById('regExtra').classList.toggle('hidden', m === 'login');
    }

    function setStrategy(s) {
        selectedStrategy = s;
        document.getElementById('btnSNR').classList.toggle('selected', s === 'SNR');
        document.getElementById('btn26').classList.toggle('selected', s === '2.6');
    }

    function handleAuth() {
        const insta = document.getElementById('userInsta').value.trim();
        const pass = document.getElementById('userPass').value.trim();
        const uid = btoa(insta).replace(/=/g, "");

        if(authMode === "reg") {
            const name = document.getElementById('userName').value;
            const promo = document.getElementById('userPromo').value;
            db.ref('users/' + uid).set({ name, instagram: insta, password: pass, promo, isPro: false })
              .then(() => { alert("Tayyor! Login qiling."); location.reload(); });
        } else {
            db.ref('users/' + uid).once('value', (s) => {
                const u = s.val();
                if(u && u.password === pass) { currentUid = uid; startDashboard(u.name); }
                else alert("Xato!");
            });
        }
    }

    function startDashboard(name) {
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
        document.getElementById('welcomeHeader').innerText = "Trader: " + name;
        db.ref('users/' + currentUid).on('value', (s) => {
            const u = s.val();
            document.getElementById('lockedSection').classList.toggle('hidden', u.isPro);
            document.getElementById('unlockedSection').classList.toggle('hidden', !u.isPro);
        });
    }

    function switchView(v) {
        document.getElementById('tabAI').classList.toggle('active', v === 'ai');
        document.getElementById('tabFibo').classList.toggle('active', v === 'fibo');
        document.getElementById('aiView').classList.toggle('hidden', v !== 'ai');
        document.getElementById('fiboView').classList.toggle('hidden', v !== 'fibo');
    }

    function startDeepAnalysis() {
        if(!document.getElementById('chartImg').files[0]) return alert("Rasm yuklang!");
        const res = document.getElementById('aiResult');
        res.innerHTML = `<p style='color:#bb86fc'>⏳ ${selectedStrategy} skanerlanmoqda...</p>`;
        
        setTimeout(() => {
            let analysisHtml = "";
            if(selectedStrategy === "SNR") {
                analysisHtml = `
                    <div style="background:#000; padding:15px; border-radius:10px; border:1px solid #333; text-align:left;">
                        <b style="color:#4caf50;">SNR ANALIZ:</b><br>
                        <p style="font-size:12px; margin:8px 0;">Eng kuchli Support: <span class="price-tag">2032.40</span></p>
                        <p style="font-size:12px; margin:8px 0;">Major Resistance: <span class="price-tag">2061.15</span></p>
                        <small style="color:#888;">Narx hozirda SBR zonasida. 2032.40 darajasidan qaytish ehtimoli 85%.</small>
                    </div>`;
            } else {
                analysisHtml = `
                    <div style="background:#000; padding:15px; border-radius:10px; border:1px solid #333; text-align:left;">
                        <b style="color:#03dac6;">2.6 MATEMATIK ANALIZ:</b><br>
                        <p style="font-size:12px; margin:8px 0;">Matematik Entry: <span class="price-tag" style="color:#03dac6">4590.25</span></p>
                        <p style="font-size:12px; margin:8px 0;">Pragnoz Garant: <span class="price-tag" style="color:#03dac6">5000.00</span></p>
                        <small style="color:#888;">2.6 sikli bo'yicha narx 4590 dan impuls olib, 5000 maqsadiga qarab harakatlanadi.</small>
                    </div>`;
            }
            res.innerHTML = analysisHtml;
        }, 2500);
    }

    function openAdmin() {
        if(prompt("Admin?") === "adminfibo007") {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            loadAdmin();
        }
    }

    function loadAdmin() {
        db.ref('users').on('value', (snap) => {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            snap.forEach((child) => {
                const u = child.val();
                list.innerHTML += `<div style="padding:10px; background:#1a1a1a; margin-top:5px; border-radius:10px; display:flex; justify-content:space-between;">
                    <span>${u.name}</span>
                    <button onclick="db.ref('users/${child.key}').update({isPro:${!u.isPro}})">${u.isPro ? 'Off':'On'}</button>
                </div>`;
            });
        });
    }
</script>
</body>
</html>
