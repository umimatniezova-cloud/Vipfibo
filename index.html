<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | AI Math Trading Terminal</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #0f0f0f; padding: 25px; border-radius: 24px; width: 100%; max-width: 450px; margin: 15px auto; border: 1px solid #1a1a1a; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 14px; border: 1px solid #222; background: #000; color: white; outline: none; font-size: 16px; }
        input:focus { border-color: #bb86fc; }
        .btn { width: 100%; padding: 16px; background: #bb86fc; color: black; border: none; border-radius: 14px; cursor: pointer; font-weight: bold; margin-top: 12px; font-size: 16px; }
        .btn:active { transform: scale(0.97); }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #1a1a1a; padding: 6px; border-radius: 16px; }
        .nav-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #888; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: #bb86fc; color: black; }
        .tool-box { background: #121212; padding: 20px; margin: 15px 0; border-radius: 18px; border-left: 5px solid #bb86fc; text-align: left; }
        .strat-btn-group { display: flex; gap: 10px; margin-top: 12px; }
        .strat-btn { flex: 1; padding: 12px; font-size: 13px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; cursor: pointer; }
        .strat-btn.selected { border-color: #bb86fc; color: #bb86fc; background: #1e142b; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #bb86fc; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #aiResult { margin-top: 20px; text-align: left; }
        .error-msg { background: rgba(244, 67, 54, 0.1); color: #f44336; padding: 15px; border-radius: 12px; border: 1px solid rgba(244, 67, 54, 0.3); font-size: 13px; }
    </style>
</head>
<body>

    <div id="authPage" class="card">
        <h2 id="authTitle" style="color: #bb86fc; margin-bottom: 25px;">VIPFIBO LOGIN</h2>
        <div class="nav-tabs">
            <button id="tabLogin" class="nav-btn active" onclick="setAuthMode('login')">Kirish</button>
            <button id="tabReg" class="nav-btn" onclick="setAuthMode('reg')">Registratsiya</button>
        </div>
        <input type="text" id="userInsta" placeholder="Instagram (@username)">
        <input type="password" id="userPass" placeholder="Parol">
        <div id="regExtra" class="hidden">
            <input type="text" id="userName" placeholder="Ismingiz">
            <input type="text" id="userPromo" placeholder="Promo-kod (Vip1...Vip1000)">
        </div>
        <button class="btn" onclick="handleAuth()">Davom etish</button>
        <p style="font-size: 11px; color: #444; margin-top: 30px; cursor: pointer;" onclick="openAdmin()">Admin Panel</p>
    </div>

    <div id="mainPage" class="card hidden">
        <h3 id="welcomeHeader" style="margin-bottom: 25px; letter-spacing: 1px;">Trader: Ozod</h3>
        <div class="nav-tabs">
            <button id="tabAI" class="nav-btn active" onclick="switchView('ai')">AI Analiz</button>
            <button id="tabFibo" class="nav-btn" onclick="switchView('fibo')">Fibo Setting</button>
        </div>

        <div id="lockedSection" class="tool-box" style="border-color: #f44336; text-align: center;">
            <p>🔒 Hisobingiz faol emas. <br><small style="color: #888;">Admin ruxsatini kuting yoki bog'laning.</small></p>
        </div>

        <div id="unlockedSection" class="hidden">
            <div id="aiView">
                <div class="tool-box">
                    <h4 style="color:#bb86fc; margin:0;">🤖 AI Multi-Strategy Analysis</h4>
                    <p style="font-size: 12px; color: #777; margin: 15px 0 5px 0;">Strategiyani tanlang:</p>
                    <div class="strat-btn-group">
                        <button id="btnSNR" class="strat-btn selected" onclick="setStrategy('SNR')">SNR Strategiya</button>
                        <button id="btn26" class="strat-btn" onclick="setStrategy('2.6')">2.6 Matematik</button>
                    </div>
                    <input type="file" id="chartImg" accept="image/*" style="margin-top:20px; font-size: 12px; background:#111; border: 1px dashed #333;">
                    <button class="btn" onclick="startDeepAnalysis()">Analizni Boshlash</button>
                    <div id="aiResult"></div>
                </div>
            </div>

            <div id="fiboView" class="hidden">
                <div class="tool-box" style="border-color: #03dac6;">
                    <h4 style="color:#03dac6; margin:0;">📐 Fibonacci OTE Settings</h4>
                    <p style="font-size: 14px; margin-top:15px; font-family: monospace;"><b>Darajalar:</b> 0.5, 0.618, 0.705, 0.79</p>
                    <p style="font-size: 12px; color: #888;">Garant qaytish zonasi: 0.79 OTE.</p>
                </div>
            </div>
        </div>
        <button class="btn" style="background:#1a1a1a; color:#888; margin-top:20px;" onclick="location.reload()">Chiqish</button>
    </div>

<script>
    // --- KONFIGURATSIYA ---
    const MY_GEMINI_API_KEY = "AIzaSyDWmZbEE6uW3nZbqeC7LQVd7pLxvuhBLhI";

    const firebaseConfig = {
        apiKey: "AIzaSyAFGJtXKgL8a1AjYK1w9ft7hI4",
        authDomain: "vipfibo-cf608.firebaseapp.com",
        databaseURL: "https://vipfibo-cf608-default-rtdb.firebaseio.com",
        projectId: "vipfibo-cf608",
        storageBucket: "vipfibo-cf608.firebasestorage.app",
        messagingSenderId: "73178155867",
        appId: "1:73178155867:web:1cfc3757d2d09668102462"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUid = "";
    let authMode = "login";
    let selectedStrategy = "SNR";

    function setAuthMode(m) {
        authMode = m;
        document.getElementById('tabLogin').classList.toggle('active', m === 'login');
        document.getElementById('tabReg').classList.toggle('active', m === 'reg');
        document.getElementById('regExtra').classList.toggle('hidden', m === 'login');
    }

    function setStrategy(s) {
        selectedStrategy = s;
        document.getElementById('btnSNR').classList.toggle('selected', s === 'SNR');
        document.getElementById('btn26').classList.toggle('selected', s === '2.6');
    }

    function handleAuth() {
        const insta = document.getElementById('userInsta').value.trim();
        const pass = document.getElementById('userPass').value.trim();
        if(!insta || !pass) return alert("Ma'lumotlarni kiriting!");
        const uid = btoa(insta).replace(/=/g, "");

        if(authMode === "reg") {
            const name = document.getElementById('userName').value;
            const promo = document.getElementById('userPromo').value;
            db.ref('users/' + uid).set({ name, instagram: insta, password: pass, promo, isPro: false })
              .then(() => { alert("Tayyor! Endi login qiling."); location.reload(); });
        } else {
            db.ref('users/' + uid).once('value', (s) => {
                const u = s.val();
                if(u && u.password === pass) { currentUid = uid; startDashboard(u.name); }
                else alert("Xato!");
            });
        }
    }

    function startDashboard(name) {
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
        document.getElementById('welcomeHeader').innerText = "Trader: " + name;
        db.ref('users/' + currentUid).on('value', (s) => {
            const u = s.val();
            document.getElementById('lockedSection').classList.toggle('hidden', u.isPro);
            document.getElementById('unlockedSection').classList.toggle('hidden', !u.isPro);
        });
    }

    function switchView(v) {
        document.getElementById('tabAI').classList.toggle('active', v === 'ai');
        document.getElementById('tabFibo').classList.toggle('active', v === 'fibo');
        document.getElementById('aiView').classList.toggle('hidden', v !== 'ai');
        document.getElementById('fiboView').classList.toggle('hidden', v !== 'fibo');
    }

    async function startDeepAnalysis() {
        const fileInput = document.getElementById('chartImg');
        const res = document.getElementById('aiResult');
        if (!fileInput.files[0]) return alert("Iltimos, grafik rasmini tanlang!");

        res.innerHTML = `<div class="loader"></div><p style="text-align:center; font-size:12px; color:#bb86fc;">AI rasmdagi narxlarni ko'rib tahlil qilmoqda...</p>`;

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onload = async () => {
            const base64Image = reader.result.split(',')[1];
            const promptText = `Ushbu grafikni ${selectedStrategy} strategiyasi bo'yicha professional tahlil qil. Rasmdagi narx darajalarini o'qi. Agar 2.6 bo'lsa, kirish va maqsad narxlarini raqamlarda hisobla.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    res.innerHTML = `<div class="error-msg"><b>Google API Xatosi:</b><br>${data.error.message}<br><br><i>Maslahat: VPN yoqib ko'ring.</i></div>`;
                    return;
                }

                if(data.candidates && data.candidates[0]) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    res.innerHTML = `
                        <div style="background:#000; padding:18px; border-radius:14px; border:1px solid #333; font-size:13px; line-height:1.6; color:#ddd;">
                            <b style="color:#bb86fc; border-bottom:1px solid #222; display:block; padding-bottom:8px; margin-bottom:12px;">📊 ANALIZ NATIJASI:</b>
                            <div style="white-space: pre-wrap;">${aiText}</div>
                        </div>`;
                }
            } catch (e) {
                res.innerHTML = `<div class="error-msg">Ulanishda xatolik! Internetingizni yoki VPN-ni tekshirib, qaytadan urinib ko'ring.</div>`;
            }
        };
    }

    function openAdmin() {
        if(prompt("Admin kod?") === "adminfibo007") {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            loadAdmin();
        }
    }

    function loadAdmin() {
        db.ref('users').on('value', (snap) => {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            snap.forEach((child) => {
                const u = child.val();
                list.innerHTML += `
                    <div style="padding:15px; background:#111; margin-top:10px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; border:1px solid #222;">
                        <div><b>${u.name}</b><br><small style="color:#555;">${u.promo}</small></div>
                        <button style="padding:8px 18px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; background:${u.isPro ? '#f44336':'#4caf50'}; color:white;" 
                            onclick="db.ref('users/${child.key}').update({isPro:${!u.isPro}})">${u.isPro ? 'OFF':'ON'}</button>
                    </div>`;
            });
        });
    }
</script>
</body>
</html>
