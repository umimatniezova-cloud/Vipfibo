<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | Trading AI System</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; margin: 0; text-align: center; }
        .hidden { display: none; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 15px; max-width: 400px; margin: 50px auto; border: 1px solid #333; }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
        .btn { padding: 12px 25px; background: #bb86fc; color: black; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status-on { color: #4caf50; font-size: 14px; margin-bottom: 10px; }
        
        /* AI & Fibo Section */
        .tool-box { background: #252525; padding: 15px; margin: 10px; border-radius: 10px; border-left: 4px solid #bb86fc; text-align: left; }
    </style>
</head>
<body>

    <div id="loginPage" class="card">
        <h2>Vipfibo Kirish</h2>
        <input type="text" id="userName" placeholder="Ismingiz">
        <input type="text" id="userInsta" placeholder="Instagram foydalanuvchi nomi">
        <button class="btn" onclick="login()">Kirish</button>
    </div>

    <div id="mainPage" class="hidden">
        <div class="card">
            <div class="status-on">Baza ulandi ✅</div>
            <h3>Xush kelibsiz, <span id="displayUserName"></span>!</h3>
            
            <div class="tool-box">
                <h4>🤖 AI Market Analysis</h4>
                <p id="aiResult">Analiz yuklanmoqda...</p>
            </div>

            <div class="tool-box">
                <h4>📐 Fibo Nastroyka (OTE)</h4>
                <p>0.62 | 0.705 | 0.79</p>
                <small>XAUUSD uchun optimal trade entry zonalari.</small>
            </div>

            <button class="btn" style="background:#555; color:white;" onclick="openAdmin()">Admin Panel (Faqat siz uchun)</button>
        </div>
    </div>

    <div id="adminPage" class="hidden">
        <div class="card" style="max-width: 600px;">
            <h3>Foydalanuvchilar Nazorati</h3>
            <table id="userTable" style="width:100%; text-align:left;">
                <thead><tr><th>Ism</th><th>Insta</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
            <button class="btn" onclick="location.reload()">Orqaga</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAFGJtXKgL8a1AjYK1w9ft7hI4",
        authDomain: "vipfibo-cf608.firebaseapp.com",
        databaseURL: "https://vipfibo-cf608-default-rtdb.firebaseio.com",
        projectId: "vipfibo-cf608",
        storageBucket: "vipfibo-cf608.firebasestorage.app",
        messagingSenderId: "73178155867",
        appId: "1:73178155867:web:1cfc3757d2d09668102462"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function login() {
        const name = document.getElementById('userName').value;
        const insta = document.getElementById('userInsta').value;

        if(name && insta) {
            const userId = btoa(insta); // Oddiy ID yaratish
            db.ref('users/' + userId).set({
                name: name,
                instagram: insta,
                isPro: false,
                lastLogin: new Date().toLocaleString()
            });

            localStorage.setItem('vipUser', userId);
            showMain(name);
        } else {
            alert("Ma'lumotlarni to'liq kiriting!");
        }
    }

    function showMain(name) {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
        document.getElementById('displayUserName').innerText = name;
        
        // Sun'iy AI Analiz
        setTimeout(() => {
            document.getElementById('aiResult').innerText = "XAUUSD: Trend Bullish. Liquidity grab kutilmoqda. Smart Money Concept asosida buy qidiring.";
        }, 1500);
    }

    function openAdmin() {
        const pass = prompt("Admin parolini kiriting:");
        if(pass === "adminfibo007") {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            loadUsers();
        }
    }

    function loadUsers() {
        db.ref('users').on('value', (snap) => {
            const tbody = document.querySelector('#userTable tbody');
            tbody.innerHTML = '';
            snap.forEach((child) => {
                const u = child.val();
                tbody.innerHTML += `<tr><td>${u.name}</td><td>${u.instagram}</td><td>${u.isPro ? 'PRO' : 'Oddiy'}</td></tr>`;
            });
        });
    }
</script>
</body>
</html>
