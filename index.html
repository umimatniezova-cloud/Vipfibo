<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | Admin Panel</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; transition: 0.3s; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f0f; 
            color: white; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .admin-container { 
            width: 95%; 
            max-width: 800px; 
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }
        h2 { color: #bb86fc; margin-top: 0; text-align: center; }
        
        #status { 
            text-align: center; 
            padding: 10px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }
        .error { background: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid #f44336; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #888; text-transform: uppercase; font-size: 12px; }
        
        .user-name { font-weight: bold; color: #fff; }
        .user-insta { color: #aaa; font-size: 14px; }
        
        .status-badge { 
            padding: 5px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold;
        }
        .status-pro { background: #4caf50; color: white; }
        .status-free { background: #555; color: #ccc; }

        .btn { 
            padding: 8px 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 13px;
        }
        .btn-pro { background: #bb86fc; color: #000; }
        .btn-pro:hover { background: #d7b4ff; shadow: 0 0 10px #bb86fc; }
        .btn-remove { background: #f44336; color: white; margin-left: 5px; }

        @media (max-width: 600px) {
            th, td { padding: 10px; font-size: 14px; }
            .btn { padding: 5px 8px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Foydalanuvchilar Monitoringi</h2>
    <div id="status" class="error">Baza ulanmagan ❌</div>
    
    <div style="overflow-x: auto;">
        <table id="userTable">
            <thead>
                <tr>
                    <th>Foydalanuvchi</th>
                    <th>Status</th>
                    <th>Amallar</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script>
    // 1. FIREBASE KONFIGURATSIYASI (Sizning loyihangiz)
    const firebaseConfig = {
        apiKey: "AIzaSyAFGJtXKgL8a1AjYK1w9ft7hI4",
        authDomain: "vipfibo-cf608.firebaseapp.com",
        databaseURL: "https://vipfibo-cf608-default-rtdb.firebaseio.com",
        projectId: "vipfibo-cf608",
        storageBucket: "vipfibo-cf608.firebasestorage.app",
        messagingSenderId: "73178155867",
        appId: "1:73178155867:web:1cfc3757d2d09668102462",
        measurementId: "G-T308GHZPR2"
    };

    // 2. INITIALIZE (Ishga tushirish)
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const statusDiv = document.getElementById('status');

    // 3. ALOQANI TEKSHIRISH
    db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
            statusDiv.innerText = "Baza ulandi ✅";
            statusDiv.className = "success";
        } else {
            statusDiv.innerText = "Baza ulanmagan ❌";
            statusDiv.className = "error";
        }
    });

    // 4. MA'LUMOTLARNI O'QISH VA JADVALGA CHIQARISH
    db.ref('users').on('value', (snapshot) => {
        const tbody = document.querySelector('#userTable tbody');
        tbody.innerHTML = '';
        
        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Hozircha foydalanuvchilar yo\'q</td></tr>';
            return;
        }

        snapshot.forEach((child) => {
            const user = child.val();
            const userId = child.key;
            
            const row = `
                <tr>
                    <td>
                        <div class="user-name">${user.name || 'Ismsiz'}</div>
                        <div class="user-insta">@${user.instagram || 'no_insta'}</div>
                    </td>
                    <td>
                        <span class="status-badge ${user.isPro ? 'status-pro' : 'status-free'}">
                            ${user.isPro ? 'PRO' : 'ODDIY'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-pro" onclick="togglePro('${userId}', ${user.isPro})">
                            ${user.isPro ? '➖ Oddiy' : '➕ PRO'}
                        </button>
                        <button class="btn btn-remove" onclick="deleteUser('${userId}')">🗑</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    });

    // 5. FUNKSIYALAR (PRO berish va O'chirish)
    function togglePro(id, currentStatus) {
        db.ref('users/' + id).update({
            isPro: !currentStatus
        }).then(() => alert("Status o'zgardi!"));
    }

    function deleteUser(id) {
        if(confirm("Ushbu foydalanuvchini o'chirib tashlamoqchimisiz?")) {
            db.ref('users/' + id).remove();
        }
    }
</script>

</body>
</html>
