<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | AI Math Trading</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #050505; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #0f0f0f; padding: 20px; border-radius: 20px; width: 100%; max-width: 450px; border: 1px solid #1a1a1a; text-align: center; margin-top: 20px; }
        .btn { width: 100%; padding: 15px; background: #bb86fc; color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .tool-box { background: #141414; padding: 15px; border-radius: 15px; border-left: 4px solid #bb86fc; text-align: left; margin: 15px 0; }
        input[type="file"] { margin: 15px 0; color: #888; }
        .loader { border: 3px solid #1a1a1a; border-top: 3px solid #bb86fc; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #aiResult { margin-top: 15px; font-size: 13px; line-height: 1.5; color: #ddd; }
    </style>
</head>
<body>

    <div class="card">
        <h3 id="userTag">Trader: Ozod</h3>
        <div class="tool-box">
            <h4 style="color:#bb86fc; margin:0;">🤖 AI 2.6 & SNR Analiz</h4>
            <select id="stratSelect" style="width:100%; padding:10px; margin-top:10px; background:#000; color:white; border-radius:8px;">
                <option value="2.6 Matematik">2.6 Matematik Strategiya</option>
                <option value="SNR Strategiya">SNR (Support/Resistance)</option>
            </select>
            <input type="file" id="chartImg" accept="image/*">
            <button class="btn" onclick="runAI()">Analizni Boshlash</button>
            <div id="aiResult"></div>
        </div>
    </div>

<script>
    // 1. Sizning API Keyingiz o'rnatildi
    const API_KEY = "AIzaSyDWmZbEE6uW3nZbqeC7LQVd7pLxvuhBLhI"; 

    async function runAI() {
        const fileInput = document.getElementById('chartImg');
        const res = document.getElementById('aiResult');
        const strat = document.getElementById('stratSelect').value;

        if (!fileInput.files[0]) return alert("Rasm yuklang!");

        res.innerHTML = `<div class="loader"></div><p style="text-align:center;">AI tahlil qilmoqda...</p>`;

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onload = async () => {
            const base64Data = reader.result.split(',')[1];
            
            // AIga yuboriladigan aniq buyruq
            const prompt = `Sen professional tradersan. Ushbu grafikni ${strat} bo'yicha analiz qil. 
            Rasmdagi narxlarni o'qi. Agar 2.6 bo'lsa, matematik kirish nuqtasi va 2.618 Fibo targetini aniq raqamlarda hisobla. 
            Faqat qisqa va aniq javob ber.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    res.innerHTML = `<p style="color:red;">Xato: ${data.error.message}<br><br>VPN ishlashini yoki API keyni tekshiring.</p>`;
                } else {
                    const text = data.candidates[0].content.parts[0].text;
                    res.innerHTML = `<div style="background:#000; padding:10px; border:1px solid #333; border-radius:10px;">${text}</div>`;
                }
            } catch (e) {
                res.innerHTML = `<p style="color:red;">Ulanish amalga oshmadi. VPN yoqilganligiga ishonch hosil qiling!</p>`;
            }
        };
    }
</script>
</body>
</html>
