<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipfibo | Monitoring</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #bb86fc; }
        #status { font-weight: bold; margin-bottom: 20px; padding: 10px; border-radius: 5px; }
        .success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #333; }
        .btn { padding: 5px 10px; cursor: pointer; border: none; border-radius: 4px; background: #bb86fc; color: black; }
    </style>
</head>
<body>

<div class="container">
    <h2>Foydalanuvchilar Boshqaruvi</h2>
    <div id="status" class="error">Baza ulanmagan ❌</div>
    
    <table id="userTable">
        <thead>
            <tr>
                <th>Ism</th>
                <th>Instagram</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    // SIZNING FIREBASE KALITLARINGIZ
    const firebaseConfig = {
        apiKey: "AIzaSyAFGJtXKgL8a1AjYK1w9ft7hI4",
        authDomain: "vipfibo-cf608.firebaseapp.com",
        databaseURL: "https://vipfibo-cf608-default-rtdb.firebaseio.com",
        projectId: "vipfibo-cf608",
        storageBucket: "vipfibo-cf608.firebasestorage.app",
        messagingSenderId: "73178155867",
        appId: "1:73178155867:web:1cfc3757d2d09668102462",
        measurementId: "G-T308GHZPR2"
    };

    // Firebase-ni ishga tushirish
    try {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const statusDiv = document.getElementById('status');

        // Bazani tekshirish
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                statusDiv.innerText = "Baza ulandi ✅";
                statusDiv.className = "success";
            } else {
                statusDiv.innerText = "Baza ulanmagan ❌";
                statusDiv.className = "error";
            }
        });

        // Ma'lumotlarni o'qish
        db.ref('users').on('value', (snapshot) => {
            const tbody = document.querySelector('#userTable tbody');
            tbody.innerHTML = '';
            snapshot.forEach((child) => {
                const user = child.val();
                const row = `<tr>
                    <td>${user.name || 'Noma'lum'}</td>
                    <td>${user.instagram || '-'}</td>
                    <td>${user.isPro ? 'PRO ✅' : 'Oddiy'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
    } catch (e) {
        console.error("Xato:", e);
    }
</script>

</body>
</html>
